name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROVEIT_REQUIRE_DOCKER: "1"   # sandbox tests fail instead of skipping if Docker is missing
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both sandbox images
        run: python -m proveit build
      - name: Full test suite
        run: python -m unittest discover -s tests -v
      - name: Offline rehearsal, twice
        run: python scripts/rehearse.py --twice
